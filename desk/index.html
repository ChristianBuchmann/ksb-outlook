<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="Desk">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#7a1f2e">
<title>Desk v15</title>
<link rel="stylesheet" href="desk.css">
</head>
<body>
<div id="app" class="app" data-version="15"></div>
<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h3 id="dlg-titel">Grund</h3>
    <p id="dlg-text" class="dim"></p>
    <textarea id="dlg-grund" rows="3" placeholder="Grund, steht in der Version"></textarea>
    <div class="dlg-knoepfe">
      <button type="button" class="knopf still" id="dlg-nein">Abbrechen</button>
      <button type="submit" class="knopf" id="dlg-ja">Übernehmen</button>
    </div>
  </form>
</dialog>
<script type="module" src="desk.js"></script>
</body>
</html>

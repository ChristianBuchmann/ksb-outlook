<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#10437D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hanoi 2026">

<link rel="apple-touch-icon" href="icon-180.png">
<title>Hanoi 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>

/* Tourneeplan Hanoi 2026, Wiener KammerOrchester.
   Aufbau nach Standard Tourneebuch Abschnitt 6: Papier, weiße Karten, Cormorant für Überschriften, Source Sans 3 für Text.
   WKO: Logo und Hausfarbe (Wiener Blau #10437D, Navy #1A1A37, Sängerknaben-Vorbild Christian 26.10.2026). Der Reisende kann den Akzent im Farbwähler ändern, Grundfarbe bleibt Wiener Blau.
   In dieser Datei stehen keine Tourdaten. Sie kommen erst nach der Anmeldung von der Funktion hanoi-login. */
:root{
  --paper:#F7F1E6; --card:#FFFFFF; --ink:#1A1A37; --grey:#6E6A62; --line:#E6DECF;
  --accent:#10437D; --on-accent:#FFFFFF; --soft:#EEE7DA;
  --err:#A93226; --ok:#2E6B3A;
  --shadow:0 1px 3px rgba(60,45,25,.09);
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --text:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1A1916; --card:#24221E; --ink:#EEE8DC; --grey:#A7A093; --line:#38342D;
    --accent:#6FA8DC; --on-accent:#1A1916; --soft:#2D2A25;
    --err:#E58C80; --ok:#8CCB97;
    --shadow:0 1px 3px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
.logo{height:52px;width:auto;display:block;margin:0 auto 12px}
.logo-weiss{display:none}
@media (prefers-color-scheme: dark){
  .logo-blau{display:none}
  .logo-weiss{display:block}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 var(--text)}
a{color:var(--accent);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.wrap{max-width:680px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Kopf */
header.kopf{text-align:center;padding-block:calc(30px + env(safe-area-inset-top, 0px)) 14px}
.marke{font:700 12px/1 var(--text);letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
h1{font:700 54px/1 var(--display);color:var(--accent);margin:10px 0 6px;letter-spacing:.02em}
.landesschrift{font:600 19px/1.2 var(--display);letter-spacing:.18em;color:var(--grey)}
.untertitel{font-size:15px;color:var(--grey);margin-top:8px}
.leiste{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.pill{font:700 13px/1 var(--text);min-height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--accent);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* Karten, Formular */
.karte{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.anmeldung{margin-block:14px 28px}
.anmeldung h2{font:700 26px/1.1 var(--display);color:var(--accent);margin:0 0 6px}
.anmeldung p{margin:0 0 14px;color:var(--grey);font-size:15.5px}
label{display:block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
input{width:100%;font:17px var(--text);padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
#inp-code{font-size:26px;letter-spacing:.32em;text-align:center;font-variant-numeric:tabular-nums}
.knopf{width:100%;font:700 17px var(--text);padding:14px;border-radius:99px;border:0;background:var(--accent);color:var(--on-accent);margin-top:14px;cursor:pointer}
.knopf:disabled{opacity:.5;cursor:default}
.nebenlinks{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:15px}
.textknopf{background:none;border:0;padding:4px 0;font:600 15px var(--text);color:var(--accent);cursor:pointer}
.meldung{font-size:15px;margin-top:12px;min-height:1.2em}
.meldung.fehler{color:var(--err)}
.meldung.gut{color:var(--ok)}
.hilfe{font-size:14px;color:var(--grey);margin-top:16px;text-align:center}

/* App */
.wer{display:flex;justify-content:center;font-size:14px;color:var(--grey);margin-bottom:4px}
.hinweis{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14.5px;margin:10px 0}
nav.reiter{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top, 0px)}
nav.reiter .zeile{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
nav.reiter .zeile::-webkit-scrollbar{display:none}
nav.reiter .pill{flex:0 0 auto;font-size:14px}
section.teil{padding-block:18px 8px}
h2.abschnitt{font:700 30px/1.1 var(--display);color:var(--accent);text-align:center;margin:4px 0 2px;text-wrap:balance}
.unterzeile{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);text-align:center;margin-bottom:16px}
h3{font:700 22px/1.2 var(--display);color:var(--accent);margin:22px 0 8px;text-wrap:balance}
h3:first-child{margin-top:0}
p{margin:0 0 10px}
.grau{color:var(--grey)}
.klein{font-size:14.5px}
.liste{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.liste > *{padding:13px 16px;border-top:1px solid var(--line)}
.liste > *:first-child{border-top:0}
.marker{display:inline-block;font:700 11px/1 var(--text);letter-spacing:.12em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);border-radius:99px;padding:4px 8px;margin-right:6px;vertical-align:2px}

/* Tage */
.tage{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}
.tage::-webkit-scrollbar{display:none}
.tag{flex:0 0 auto;width:58px;height:66px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--accent);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--text)}
.tag .wt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tag .zahl{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tag .mon{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.tag[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tag.heute{box-shadow:0 0 0 2px var(--accent) inset}
.tagkopf{font:700 25px/1.15 var(--display);color:var(--accent);margin:4px 0 10px}

/* Programm */
.programm{margin-bottom:22px}
.programm .datum{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.programm .titel{font:700 25px/1.15 var(--display);color:var(--accent);margin:2px 0 4px}
.programm .solisten{font:600 italic 18px/1.3 var(--display);margin-bottom:10px}
.programm ul{list-style:none;margin:0;padding:0}
.programm li{padding:8px 0;border-top:1px solid var(--line);font-size:15.5px}
.programm li:first-child{border-top:0}
.programm li.pause{text-align:center;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-size:13px;padding:12px 0}

/* Flüge */
.flug{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:2px;font-variant-numeric:tabular-nums}
.flug .wann{font-weight:700;white-space:nowrap}
.flug .nr{font-weight:700;color:var(--accent)}
.flug .route{grid-column:1 / -1;min-width:0}
.flug .zeit{grid-column:1 / -1;color:var(--grey);font-size:15px}

/* Kontakte */
.kontakt .name{font:700 20px/1.2 var(--display)}
.kontakt .rolle{font-size:14.5px;color:var(--grey);margin-top:2px}
.kontakt .wege{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:15.5px;font-variant-numeric:tabular-nums}
.kontakt .wege a{word-break:break-all}
.orga{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin:20px 0 8px}
.orga:first-child{margin-top:0}

/* Fuß */
footer.fuss{text-align:center;color:var(--grey);font-size:14px;padding-block:30px calc(30px + env(safe-area-inset-bottom, 0px))}
footer.fuss p{margin:0 0 8px}
.farben{display:flex;justify-content:center;gap:10px;margin:12px 0 18px}
.farbe{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.farbe[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
@media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth} }

/* App: Anmerkungen, Bearbeiten, Warteschlange */
.notizen{margin-top:14px}
.notiz{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;margin-top:8px;border-left:4px solid var(--line)}
.notiz.alle{border-left-color:var(--accent)}
.notiz .kopfzeile{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--grey);letter-spacing:.04em}
.notiz .inhalt{white-space:pre-wrap;margin-top:4px;font-size:15.5px}
.notiz .warte{color:var(--err);font-weight:700}
.notiz .aktionen{display:flex;gap:16px;margin-top:4px}
.zeilen{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.zeilen .pill{font-size:14px}
textarea{width:100%;min-height:110px;font:16px/1.4 var(--text);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.editor{margin-top:12px}
.editor .knopf{margin-top:10px}
.editor .zeile2{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:15px}
.editor .zeile2 input{width:auto}
.knopf.zweit{background:var(--card);color:var(--accent);border:1px solid var(--line)}
.status{position:sticky;bottom:0;z-index:6;background:var(--accent);color:var(--on-accent);text-align:center;font-size:14px;padding:8px 16px calc(8px + env(safe-area-inset-bottom, 0px))}
.status.warn{background:var(--err)}
.recht{display:inline-block;font:700 11px/1 var(--text);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:3px 7px;margin-left:8px}
.geaendert{font-size:12.5px;color:var(--err);margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="kopf">
    <img class="logo logo-blau" src="wko-sunburst-blau.png" alt="" width="760" height="421">
    <img class="logo logo-weiss" src="wko-sunburst-weiss.png" alt="" width="760" height="417">
    <div class="marke">Wiener KammerOrchester</div>
    <h1>Hanoi 2026</h1>
    <div class="landesschrift" lang="vi">Hà Nội</div>
    <div class="untertitel" data-t="untertitel">Tourneeplan</div>
    <div class="leiste" role="group" aria-label="Sprache">
      <button class="pill" type="button" data-sprache="de">DE</button>
      <button class="pill" type="button" data-sprache="en">EN</button>
      <button class="pill" type="button" data-sprache="vi">VI</button>
    </div>
  </header>

  <section class="karte anmeldung" id="schritt-mail" hidden>
    <h2 data-t="anmeldung">Anmeldung</h2>
    <p data-t="anmeldungText"></p>
    <div class="hinweis" id="wartet-login" hidden></div>
    <form id="form-mail" novalidate>
      <label for="inp-mail" data-t="mailLabel">E-Mail-Adresse</label>
      <input type="email" id="inp-mail" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required>
      <button class="knopf" type="submit" id="btn-mail" data-t="codeAnfordern">Code anfordern</button>
    </form>
    <div class="meldung" id="msg-mail" role="status"></div>
    <div class="hilfe"><span data-t="hilfe">Fragen zur Anmeldung:</span> doris@buchmann.at</div>
  </section>

  <section class="karte anmeldung" id="schritt-code" hidden>
    <h2 data-t="anmeldung">Anmeldung</h2>
    <p id="code-text"></p>
    <form id="form-code" novalidate>
      <label for="inp-code" data-t="codeLabel">Code aus der Mail</label>
      <input type="text" id="inp-code" autocomplete="one-time-code" inputmode="numeric" maxlength="7" required>
      <button class="knopf" type="submit" id="btn-code" data-t="anmelden">Anmelden</button>
    </form>
    <div class="meldung" id="msg-code" role="status"></div>
    <div class="nebenlinks">
      <button class="textknopf" type="button" id="btn-neu" data-t="neuerCode">Neuen Code anfordern</button>
      <button class="textknopf" type="button" id="btn-andere" data-t="andereAdresse">Andere Adresse</button>
    </div>
  </section>

  <section class="karte anmeldung" id="laden" hidden>
    <p id="laden-text" data-t="laden">Der Tourneeplan wird geladen.</p>
    <button class="knopf" type="button" id="btn-nochmal" data-t="nochmal" hidden>Noch einmal versuchen</button>
  </section>
</div>

<div id="app" hidden>
  <div class="wrap">
    <div class="wer" id="wer"></div>
    <div class="hinweis" id="offline" hidden></div>
  </div>
  <nav class="reiter" aria-label="Abschnitte">
    <div class="wrap"><div class="zeile" id="reiter"></div></div>
  </nav>
  <div class="wrap">
    <section class="teil" id="teil-tage" data-reiter="tage"></section>
    <section class="teil" id="teil-notizen" data-reiter="notizen" hidden></section>
    <section class="teil" id="teil-programm" data-reiter="programm" hidden></section>
    <section class="teil" id="teil-fluege" data-reiter="fluege" hidden></section>
    <section class="teil" id="teil-hotels" data-reiter="hotels" hidden></section>
    <section class="teil" id="teil-info" data-reiter="info" hidden></section>
    <section class="teil" id="teil-kontakte" data-reiter="kontakte" hidden></section>
  </div>
</div>

<footer class="fuss wrap">
  <div id="fuss-app" hidden>
    <div class="farben" id="farben" role="group" aria-label="Farbe"></div>
    <p data-t="vorbehalt"></p>
    <p id="vi-hinweis" class="klein" hidden data-t="viHinweis"></p>
    <p><button class="textknopf" type="button" id="btn-ab" data-t="abmelden">Abmelden</button></p>
  </div>
  <p data-t="herausgeber"></p>
</footer>
<div class="status" id="status" hidden></div>

function lies(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function schreib(k, v){ try{ if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }
function liesJ(k, ersatz){ try{ var v = JSON.parse(lies(k) || 'null'); return v == null ? ersatz : v; }catch(e){ return ersatz; } }
function $(id){ return document.getElementById(id); }
function t(k, ersatz){
  var s = (TXT[LANG] && TXT[LANG][k] != null && TXT[LANG][k] !== '' ? TXT[LANG][k] : null);
  if (s == null) s = (LANG === 'vi' ? TXT.en[k] : null) || TXT.de[k] || '';
  if (ersatz) Object.keys(ersatz).forEach(function(n){ s = s.split('{' + n + '}').join(ersatz[n]); });
  return s;
}
function L(v){
  if (v == null) return '';
  if (typeof v === 'object' && !Array.isArray(v)) return v[LANG] || (LANG === 'vi' ? v.en : null) || v.de || v.en || '';
  return String(v);
}
function el(tag, attrs){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'text') e.textContent = v;
    else if (k === 'class') e.className = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(function(x){ if (x != null && x !== false) e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
    else e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
function locale(){ return LANG === 'en' ? 'en-GB' : LANG === 'vi' ? 'vi-VN' : 'de-AT'; }
function datum(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function fmt(iso, opts){ var d = datum(iso); return d ? new Intl.DateTimeFormat(locale(), opts).format(d) : (iso || ''); }
function langesDatum(iso){ return fmt(iso, { weekday:'long', day:'numeric', month:'long', year:'numeric' }); }
function kurzesDatum(iso){ return fmt(iso, { weekday:'short', day:'numeric', month:'short' }); }
function zeitText(ms){ return new Intl.DateTimeFormat(locale(), { day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit' }).format(new Date(ms)); }
function heuteIso(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function karteLink(adresse){ return 'https://maps.apple.com/?q=' + encodeURIComponent(adresse + ', Vietnam'); }

function neueId(){
  var a = new Uint8Array(12);
  try{ crypto.getRandomValues(a); }catch(e){ for (var i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256); }
  return 'g' + Array.prototype.map.call(a, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
}

/* Server */
function rufe(body){
  return fetch(FN, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(body), cache:'no-store' })
    .then(function(r){ return r.json().catch(function(){ return { ok:false, status:'SERVER' }; }); },
          function(){ return { ok:false, status:'NETZ' }; });
}

/* Warteschlange im Gerät. Jede Anmerkung hat eine eigene Kennung; der Server nimmt sie genau einmal. */
function ausgang(){ return liesJ(K.ausgang, []); }
function ausgangSchreiben(a){ schreib(K.ausgang, a.length ? JSON.stringify(a) : null); statusZeigen(); }
function inAusgang(op){
  var a = ausgang();
  if (op.art === 'notiz') a = a.filter(function(x){ return !(x.art === 'notiz' && x.client_id === op.client_id); });
  if (op.art === 'tag') a = a.filter(function(x){ return !(x.art === 'tag' && x.datum === op.datum); });
  a.push(op); ausgangSchreiben(a);
  allesBauen(); abgleichen();
}

var LAEUFT = false;
function abgleichen(){
  var token = lies(K.token);
  if (LAEUFT || !token) return Promise.resolve();
  var a = ausgang();
  if (!a.length) return Promise.resolve();
  LAEUFT = true;
  var notizen = a.filter(function(x){ return x.art === 'notiz'; });
  var tage = a.filter(function(x){ return x.art === 'tag'; });
  var kette = Promise.resolve(true);
  /* Tage zuerst, ein Konflikt wird zur privaten Anmerkung, damit nichts verloren geht */
  tage.forEach(function(op){
    kette = kette.then(function(weiter){
      if (!weiter) return false;
      return rufe({ action:'tag_speichern', token:token, datum:op.datum, activities:op.activities, basis:op.basis }).then(function(j){
        if (j.status === 'NETZ' || j.status === 'SERVER') return false;
        if (j.status === 'SESSION_UNGUELTIG'){ sitzungWeg(); return false; }
        var rest = ausgang().filter(function(x){ return !(x.art === 'tag' && x.datum === op.datum && x.zeit === op.zeit); });
        if (j.ok){
          tagLokalSetzen(j.tag, j.basis);
        } else if (j.status === 'KONFLIKT'){
          if (j.tag) tagLokalSetzen(j.tag, j.basis);
          rest.push({ art:'notiz', client_id:neueId(), ziel:'tag:' + op.datum, sichtbar:'privat', zeit:new Date().toISOString(),
                      text:t('konfliktNotiz') + '\n' + op.activities.join('\n') });
          meldenStatus(t('konflikt', { tag:kurzesDatum(op.datum) }), true);
        }
        ausgangSchreiben(rest);
        return true;
      });
    });
  });
  return kette.then(function(weiter){
    var jetzt = ausgang().filter(function(x){ return x.art === 'notiz'; });
    if (!weiter || !jetzt.length) return;
    var ops = jetzt.map(function(x){ return { client_id:x.client_id, ziel:x.ziel, text:x.text, sichtbar:x.sichtbar, geloescht:!!x.geloescht, zeit:x.zeit }; });
    return rufe({ action:'notizen_sync', token:token, ops:ops }).then(function(j){
      if (j.status === 'SESSION_UNGUELTIG'){ sitzungWeg(); return; }
      if (!j.ok) return;
      var erledigt = {};
      (j.ergebnisse || []).forEach(function(e){ erledigt[e.client_id] = true; });
      ausgangSchreiben(ausgang().filter(function(x){
        return !(x.art === 'notiz' && erledigt[x.client_id] && jetzt.some(function(y){ return y.client_id === x.client_id && y.zeit === x.zeit; }));
      }));
      if (ROH){ ROH.notizen = j.notizen || []; cacheSchreiben(); }
    });
  }).then(function(){ LAEUFT = false; allesBauen(); if (!ausgang().length && notizen.length + tage.length) meldenStatus(t('gesendet'), false, 2500); },
          function(){ LAEUFT = false; });
}

function tagLokalSetzen(tag, basis){
  if (!ROH || !tag) return;
  var s = (ROH.content.schedule || []).filter(function(d){ return d.date !== tag.date; });
  s.push(tag); s.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  ROH.content.schedule = s;
  ROH.tag_basis = ROH.tag_basis || {}; ROH.tag_basis[tag.date] = basis;
  if (ROH.content_vi && ROH.content_vi.schedule) delete ROH.content_vi.schedule[tag.date];
  cacheSchreiben(); datenAufbereiten();
}

/* Status unten */
var STATUS_TIMER = null;
function meldenStatus(text, warn, dauer){
  var s = $('status'); s.textContent = text; s.className = 'status' + (warn ? ' warn' : ''); s.hidden = false;
  clearTimeout(STATUS_TIMER);
  STATUS_TIMER = setTimeout(statusZeigen, dauer || 7000);
}
function statusZeigen(){
  var n = ausgang().length, s = $('status');
  if (!$('app').hidden && n){ s.textContent = t('wartetN', { n:n }); s.className = 'status warn'; s.hidden = false; }
  else s.hidden = true;
}

/* Daten */
function cacheSchreiben(){ if (ROH) schreib(K.cache, JSON.stringify({ zeit:ROH.zeit || Date.now(), roh:ROH, mail:MAIL })); }
function datenAufbereiten(){
  if (!ROH) { DATEN = null; return; }
  var c = JSON.parse(JSON.stringify(ROH.content || {}));
  if (LANG === 'vi' && ROH.content_vi){
    Object.keys(ROH.content_vi).forEach(function(k){
      if (k === 'schedule'){
        (c.schedule || []).forEach(function(d){ var v = ROH.content_vi.schedule[d.date]; if (v) d.activities = v; });
      } else c[k] = ROH.content_vi[k];
    });
  }
  /* Tagesänderungen, die noch im Gerät warten, schon zeigen */
  ausgang().filter(function(x){ return x.art === 'tag'; }).forEach(function(op){
    var s = (c.schedule || []).filter(function(d){ return d.date !== op.datum; });
    s.push({ date:op.datum, activities:op.activities, wartet:true });
    s.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
    c.schedule = s;
  });
  DATEN = c;
}
function notizenSicht(){
  var server = (ROH && ROH.notizen) || [];
  var warte = ausgang().filter(function(x){ return x.art === 'notiz'; });
  var nach = {};
  server.forEach(function(n){ if (n.eigen) nach['e' + n.client_id] = n; else nach['f' + n.client_id + n.von] = n; });
  warte.forEach(function(w){
    if (w.geloescht) { delete nach['e' + w.client_id]; return; }
    nach['e' + w.client_id] = { client_id:w.client_id, ziel:w.ziel, text:w.text, sichtbar:w.sichtbar, eigen:true, von:'', zeit:w.zeit, wartet:true };
  });
  return Object.keys(nach).map(function(k){ return nach[k]; }).sort(function(a, b){ return String(a.zeit) < String(b.zeit) ? -1 : 1; });
}

function baueTage(c){
  var box = $('teil-tage'); box.innerHTML = '';
  box.append.apply(box, kopf('tage'));
  var tage = (c.schedule || []).filter(function(d){ return d && d.date; });
  if (!tage.length){ box.appendChild(leer()); }
  var heute = heuteIso();
  if (tage.length && (TAG == null || !tage.some(function(d){ return d.date === TAG; }))){
    TAG = tage.some(function(d){ return d.date === heute; }) ? heute : tage[0].date;
  }
  var leiste = el('div', { class:'tage', role:'group', 'aria-label':t('r_tage') });
  tage.forEach(function(d){
    leiste.appendChild(el('button', {
      class:'tag' + (d.date === heute ? ' heute' : ''), type:'button', 'aria-pressed': d.date === TAG, 'aria-label': langesDatum(d.date),
      onclick:function(){ TAG = d.date; OFFEN = null; baueTage(DATEN); }
    }, el('span', { class:'wt', text:fmt(d.date, { weekday:'short' }).replace('.', '') }),
       el('span', { class:'zahl', text:String(datum(d.date).getDate()) }),
       el('span', { class:'mon', text:fmt(d.date, { month:'short' }).replace('.', '') })));
  });
  box.appendChild(leiste);
  if (OFFEN && OFFEN.art === 'tagneu'){ box.appendChild(tagEditor(null, true)); return; }
  var tag = tage.filter(function(d){ return d.date === TAG; })[0];
  if (tag){
    box.appendChild(el('div', { class:'tagkopf', text:langesDatum(tag.date) }));
    if (OFFEN && OFFEN.art === 'tag' && OFFEN.datum === tag.date) box.appendChild(tagEditor(tag, false));
    else {
      var acts = (tag.activities || []).map(function(a){
        if (a && typeof a === 'object' && !Array.isArray(a) && 'text' in a) return el('div', null, persoenlich(a), a.time ? el('strong', { text:L(a.time) + ' ' }) : null, L(a.text));
        return el('div', { text:L(a) });
      });
      box.appendChild(acts.length ? el('div', { class:'liste' }, acts) : leer());
      if (tag.wartet) box.appendChild(el('p', { class:'geaendert', text:t('wartet') }));
    }
    var ns = notizenSicht().filter(function(n){ return n.ziel === 'tag:' + tag.date; });
    var nbox = el('div', { class:'notizen' }, ns.map(notizKarte));
    if (OFFEN && OFFEN.art === 'notizneu' && OFFEN.ziel === 'tag:' + tag.date) nbox.appendChild(notizEditor('tag:' + tag.date, null));
    box.appendChild(nbox);
  }
  if (!OFFEN) box.appendChild(el('div', { class:'zeilen' },
    tag ? el('button', { class:'pill', type:'button', text:t('notizNeu'), onclick:function(){ OFFEN = { art:'notizneu', ziel:'tag:' + tag.date }; baueTage(DATEN); } }) : null,
    istAdmin() && tag ? el('button', { class:'pill', type:'button', text:t('tagBearbeiten'), onclick:function(){ OFFEN = { art:'tag', datum:tag.date }; baueTage(DATEN); } }) : null,
    istAdmin() ? el('button', { class:'pill', type:'button', text:t('tagNeu'), onclick:function(){ OFFEN = { art:'tagneu' }; baueTage(DATEN); } }) : null));
  var akt = leiste.querySelector('[aria-pressed="true"]');
  if (akt && akt.scrollIntoView) try{ akt.scrollIntoView({ block:'nearest', inline:'center' }); }catch(e){}
}

function baueNotizen(){
  var box = $('teil-notizen'); box.innerHTML = '';
  box.append.apply(box, kopf('notizen'));
  var ns = notizenSicht();
  if (OFFEN && OFFEN.art === 'notizneu' && OFFEN.ziel === 'allgemein') box.appendChild(notizEditor('allgemein', null));
  else box.appendChild(el('div', { class:'zeilen', style:'margin-bottom:8px' },
    el('button', { class:'pill', type:'button', text:t('notizNeu'), onclick:function(){ OFFEN = { art:'notizneu', ziel:'allgemein' }; baueNotizen(); } })));
  if (!ns.length){ box.appendChild(el('p', { class:'grau', text:t('keineNotizen') })); return; }
  var gruppen = {};
  ns.forEach(function(n){ (gruppen[n.ziel] = gruppen[n.ziel] || []).push(n); });
  Object.keys(gruppen).sort(function(a, b){ return a === 'allgemein' ? -1 : b === 'allgemein' ? 1 : (a < b ? -1 : 1); }).forEach(function(z){
    box.appendChild(el('h3', { text: z === 'allgemein' ? t('allgemein') : langesDatum(z.slice(4)) }));
    gruppen[z].forEach(function(n){ box.appendChild(notizKarte(n)); });
  });
}

function baueProgramm(c){
  var box = $('teil-programm'); box.innerHTML = '';
  box.append.apply(box, kopf('programm'));
  var pr = c.programmes || [];
  if (!pr.length){ box.appendChild(leer()); return; }
  pr.forEach(function(p){
    box.appendChild(el('div', { class:'karte programm' },
      el('div', { class:'datum', text:langesDatum(p.date) }),
      el('div', { class:'titel', text:L(p.title) }),
      p.soloists ? el('div', { class:'solisten', text:L(p.soloists) }) : null,
      el('ul', null, (p.works || []).map(function(w){
        var s = L(w);
        if (/^(intermission|pause|interval|giải lao)$/i.test(s.trim())) return el('li', { class:'pause', text:t('pause') });
        return el('li', { text:s });
      }))));
  });
  if (c.run_of_show){
    box.appendChild(el('h3', { text:t('ablauf') }));
    box.appendChild(el('div', { class:'karte' }, el('p', { style:'margin:0', text:L(c.run_of_show.text != null ? c.run_of_show.text : c.run_of_show) })));
  }
}

function flugZeile(f){
  return el('div', { class:'flug' },
    el('span', { class:'wann', text:kurzesDatum(f.date) }),
    el('span', { class:'nr', text:L(f.flight) }),
    el('span', { class:'route', text:L(f.route) }),
    f.time ? el('span', { class:'zeit', text:L(f.time) }) : null);
}
function baueFluege(c){
  var box = $('teil-fluege'); box.innerHTML = '';
  box.append.apply(box, kopf('fluege'));
  var f = c.flights;
  if (!f){ box.appendChild(leer()); return; }
  if ((f.group_outbound || []).length){ box.appendChild(el('h3', { text:t('hinflug') })); box.appendChild(el('div', { class:'liste' }, f.group_outbound.map(flugZeile))); }
  if ((f.group_return || []).length){ box.appendChild(el('h3', { text:t('rueckflug') })); box.appendChild(el('div', { class:'liste' }, f.group_return.map(flugZeile))); }
  if ((f.exceptions || []).length){
    box.appendChild(el('h3', { text:t('ausnahmen') }));
    box.appendChild(el('div', { class:'liste' }, f.exceptions.map(function(x){
      return el('div', null, persoenlich(x), el('strong', { text:L(x.person) }), el('div', { class:'klein', text:L(x.detail) }));
    })));
  }
  if (f.timezone_note) box.appendChild(el('p', { class:'grau klein', style:'margin-top:14px', text:L(f.timezone_note) }));
}

function baueHotels(c){
  var box = $('teil-hotels'); box.innerHTML = '';
  box.append.apply(box, kopf('hotels'));
  var h = c.hotels;
  if (!h){ box.appendChild(leer()); return; }
  if (h.status) box.appendChild(el('div', { class:'hinweis', text:L(h.status) }));
  var liste = (h.hotels || []).map(function(x){
    return el('div', null, persoenlich(x),
      el('div', { class:'kontakt' }, el('div', { class:'name', text:L(x.name) })),
      x.address ? el('a', { href:karteLink(L(x.address)), target:'_blank', rel:'noopener', text:L(x.address) }) : null,
      x.phone ? el('div', null, el('a', { href:telLink(L(x.phone)), text:L(x.phone) })) : null,
      x.rooms ? el('div', { class:'grau klein', text:L(x.rooms) }) : null);
  });
  if (liste.length) box.appendChild(el('div', { class:'liste' }, liste));
  if (h.notes) box.appendChild(el('p', { class:'grau klein', style:'margin-top:14px', text:L(h.notes) }));
}

function baueInfo(c){
  var box = $('teil-info'); box.innerHTML = '';
  box.append.apply(box, kopf('info'));
  var n = 0;
  if (c.venue){
    n++;
    box.appendChild(el('h3', { text:t('spielort') }));
    box.appendChild(el('div', { class:'karte' },
      el('div', { class:'kontakt' }, el('div', { class:'name', text:L(c.venue.name) })),
      c.venue.address ? el('a', { href:karteLink(L(c.venue.address)), target:'_blank', rel:'noopener', text:L(c.venue.address) }) : null,
      c.venue.operator ? el('div', { class:'grau klein', style:'margin-top:6px', text:t('veranstalter') + ': ' + L(c.venue.operator) }) : null));
  }
  [['visa','visum'], ['meals','essen'], ['free_day_excursion','freiertag']].forEach(function(p){
    var v = c[p[0]]; if (!v) return; n++;
    box.appendChild(el('h3', { text:t(p[1]) }));
    box.appendChild(el('div', { class:'karte' }, el('p', { style:'margin:0', text:L(v.text != null ? v.text : v) })));
  });
  if (!n) box.appendChild(leer());
}

function baueKontakte(c){
  var box = $('teil-kontakte'); box.innerHTML = '';
  box.append.apply(box, kopf('kontakte'));
  var ks = c.contacts || [];
  if (!ks.length){ box.appendChild(leer()); return; }
  var gruppen = [], nach = {};
  ks.forEach(function(k){ var o = L(k.org) || ''; if (!nach[o]){ nach[o] = []; gruppen.push(o); } nach[o].push(k); });
  gruppen.forEach(function(o){
    if (o) box.appendChild(el('div', { class:'orga', text:o }));
    box.appendChild(el('div', { class:'liste' }, nach[o].map(function(k){
      return el('div', { class:'kontakt' },
        el('div', { class:'name', text:L(k.name) }),
        k.role ? el('div', { class:'rolle', text:L(k.role) }) : null,
        el('div', { class:'wege' },
          k.phone ? el('a', { href:telLink(L(k.phone)), text:L(k.phone) }) : null,
          k.email ? el('a', { href:'mailto:' + L(k.email), text:L(k.email) }) : null));
    })));
  });
}

function reiterBauen(){
  var z = $('reiter'); z.innerHTML = '';
  REITER.forEach(function(r){
    z.appendChild(el('button', { class:'pill', type:'button', 'aria-pressed': r === AKTIV, text:t('r_' + r),
      onclick:function(){ OFFEN = null; reiterWaehlen(r, true); allesBauen(); } }));
  });
}
function reiterWaehlen(r, nachOben){
  AKTIV = REITER.indexOf(r) >= 0 ? r : 'tage';
  schreib(K.reiter, AKTIV);
  document.querySelectorAll('section.teil').forEach(function(s){ s.hidden = (s.getAttribute('data-reiter') !== AKTIV); });
  document.querySelectorAll('#reiter .pill').forEach(function(b, i){ b.setAttribute('aria-pressed', REITER[i] === AKTIV); });
  if (nachOben){ var n = document.querySelector('nav.reiter'); if (n && window.scrollY > n.offsetTop) window.scrollTo(0, n.offsetTop); }
}

function allesBauen(){
  datenAufbereiten();
  if (!DATEN) return;
  if (REISENDER){
    var w = $('wer'); w.innerHTML = '';
    w.appendChild(document.createTextNode(t('angemeldet', { name:[REISENDER.vorname, REISENDER.nachname].filter(Boolean).join(' ') })));
    if (istAdmin()) w.appendChild(el('span', { class:'recht', text:t('admin') }));
  }
  reiterBauen();
  baueTage(DATEN); baueNotizen(); baueProgramm(DATEN); baueFluege(DATEN); baueHotels(DATEN); baueInfo(DATEN); baueKontakte(DATEN);
  reiterWaehlen(AKTIV, false);
  statusZeigen();
}

function spracheSetzen(s, ausdruecklich){
  LANG = SPRACHEN.indexOf(s) >= 0 ? s : 'de';
  if (ausdruecklich) schreib(K.sprache, LANG);
  texteSetzen(); allesBauen();
}
function spracheAusPerson(){
  if (!lies(K.sprache) && REISENDER && SPRACHEN.indexOf(REISENDER.sprache) >= 0) LANG = REISENDER.sprache;
}

/* Ablauf */
function cacheZeigen(c){
  ROH = c.roh; REISENDER = ROH.reisender || null; MAIL = c.mail || MAIL;
  spracheAusPerson(); texteSetzen(); zeige('app'); allesBauen();
}
function datenLaden(){
  var token = lies(K.token);
  var c = liesJ(K.cache, null);
  if (!token){
    /* Anmeldung abgelaufen: der Plan bleibt lesbar, die Anmeldung steht oben */
    if (c && c.roh) cacheZeigen(c); else zeige('schritt-mail');
    $('schritt-mail').hidden = false; texteSetzen(); return;
  }
  /* Sofort aus dem Gerät, dann im Hintergrund frisch holen */
  if (c && c.roh) cacheZeigen(c); else { zeige('laden'); $('btn-nochmal').hidden = true; $('laden-text').textContent = t('laden'); }
  abgleichen().then(function(){ return rufe({ action:'inhalt', token:token }); }).then(function(j){
    if (j.ok){
      ROH = { content:j.content || {}, content_vi:j.content_vi || {}, tag_basis:j.tag_basis || {}, notizen:j.notizen || [], reisender:j.reisender, zeit:Date.now() };
      REISENDER = j.reisender || null; cacheSchreiben();
      $('offline').hidden = true;
      spracheAusPerson(); texteSetzen(); zeige('app'); allesBauen();
      return;
    }
    if (j.status === 'SESSION_UNGUELTIG' || j.status === 'KEIN_TOKEN'){ sitzungWeg(); return; }
    if (ROH){
      var o = $('offline'); o.textContent = t('offline', { zeit:zeitText(ROH.zeit || Date.now()) }); o.hidden = false;
      return;
    }
    $('laden-text').textContent = t(j.status === 'NETZ' ? 'e_NETZ' : 'e_SERVER');
    $('btn-nochmal').hidden = false;
  });
}
/* Sitzung abgelaufen: Token weg, aber Plan und wartende Anmerkungen bleiben im Gerät */
function sitzungWeg(){
  schreib(K.token, null);
  $('inp-mail').value = MAIL || lies(K.mail) || '';
  texteSetzen();
  if (ROH) $('schritt-mail').hidden = false; else zeige('schritt-mail');
  try{ window.scrollTo(0, 0); }catch(e){}
}

function codeAnfordern(neu){
  var mail = ($('inp-mail').value || MAIL || '').trim().toLowerCase();
  var ziel = neu ? 'msg-code' : 'msg-mail';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){ meldung(ziel, t('e_EMAIL_UNGUELTIG'), 'fehler'); return; }
  var knopf = neu ? $('btn-neu') : $('btn-mail');
  knopf.disabled = true; meldung(ziel, '');
  rufe({ action:'request_code', email:mail, seite:SEITE }).then(function(j){
    knopf.disabled = false;
    if (j.ok){
      MAIL = mail; schreib(K.mail, mail);
      CODE_HINWEIS = j.hinweis || null;
      texteSetzen(); zeige('schritt-code');
      $('inp-code').value = '';
      meldung('msg-code', neu ? t('neuGeschickt') : '', neu ? 'gut' : '');
      try{ $('inp-code').focus(); }catch(e){}
      return;
    }
    meldung(ziel, t('e_' + (j.status || 'SERVER')), 'fehler');
  });
}
function codePruefen(){
  var code = ($('inp-code').value || '').replace(/\D+/g, '');
  if (code.length !== 6){ meldung('msg-code', t('e_EINGABE_FEHLT'), 'fehler'); return; }
  $('btn-code').disabled = true; meldung('msg-code', '');
  rufe({ action:'verify_code', email:MAIL, code:code }).then(function(j){
    $('btn-code').disabled = false;
    if (j.ok && j.token){
      /* Andere Person auf diesem Gerät: alten Stand und fremde Warteschlange nicht übernehmen */
      var c = liesJ(K.cache, null);
      if (c && c.mail && c.mail !== MAIL){ schreib(K.cache, null); schreib(K.ausgang, null); ROH = null; }
      schreib(K.token, j.token);
      datenLaden();
      return;
    }
    meldung('msg-code', t('e_' + (j.status || 'SERVER')), 'fehler');
  });
}
function abmelden(){
  var n = ausgang().length;
  if (n && !window.confirm(t('abmeldenWarte', { n:n }))) return;
  schreib(K.token, null); schreib(K.cache, null); schreib(K.ausgang, null);
  ROH = null; DATEN = null; REISENDER = null; TAG = null; OFFEN = null;
  $('inp-mail').value = MAIL || lies(K.mail) || '';
  meldung('msg-mail', ''); texteSetzen(); zeige('schritt-mail');
}

/* Start */
document.querySelectorAll('[data-sprache]').forEach(function(b){
  b.addEventListener('click', function(){ spracheSetzen(b.getAttribute('data-sprache'), true); });
});
$('form-mail').addEventListener('submit', function(e){ e.preventDefault(); codeAnfordern(false); });
$('form-code').addEventListener('submit', function(e){ e.preventDefault(); codePruefen(); });
$('inp-code').addEventListener('input', function(){ var v = this.value.replace(/\D+/g, ''); if (v.length === 6 && !$('btn-code').disabled) codePruefen(); });
$('btn-neu').addEventListener('click', function(){ codeAnfordern(true); });
$('btn-andere').addEventListener('click', function(){ MAIL = ''; schreib(K.mail, null); $('inp-mail').value = ''; meldung('msg-mail', ''); zeige('schritt-mail'); });
$('btn-nochmal').addEventListener('click', datenLaden);
$('btn-ab').addEventListener('click', abmelden);
window.addEventListener('online', function(){ abgleichen(); });
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') abgleichen(); });
setInterval(function(){ if (navigator.onLine !== false) abgleichen(); }, 60000);

var gespeichert = lies(K.sprache);
if (SPRACHEN.indexOf(gespeichert) >= 0) LANG = gespeichert;
else { var nl = (navigator.language || 'de').toLowerCase(); LANG = /^de/.test(nl) ? 'de' : /^vi/.test(nl) ? 'vi' : 'en'; }
AKTIV = lies(K.reiter) || 'tage';
MAIL = lies(K.mail) || '';
$('inp-mail').value = MAIL;
farbenBauen();
texteSetzen();
datenLaden();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
</body>
</html>
